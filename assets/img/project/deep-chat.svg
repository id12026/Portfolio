<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Chat Interface -->
  <rect x="200" y="80" width="400" height="240" rx="15" fill="white" opacity="0.95"/>
  
  <!-- Chat Header -->
  <rect x="200" y="80" width="400" height="40" rx="15" fill="#667eea"/>
  <rect x="200" y="100" width="400" height="20" fill="#667eea"/>
  <circle cx="230" cy="100" r="12" fill="white"/>
  <text x="230" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#667eea">🤖</text>
  <text x="260" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="white">Deep Chat Assistant</text>
  
  <!-- Chat Messages -->
  <rect x="220" y="135" width="250" height="45" rx="10" fill="#E3F2FD"/>
  <text x="235" y="155" font-family="Arial" font-size="12" fill="#333">How do I query a PDF document?</text>
  <text x="235" y="170" font-family="Arial" font-size="10" fill="#666">User • Just now</text>
  
  <rect x="330" y="195" width="250" height="65" rx="10" fill="#667eea"/>
  <text x="345" y="215" font-family="Arial" font-size="12" fill="white">I can help! I use Tesseract OCR</text>
  <text x="345" y="230" font-family="Arial" font-size="12" fill="white">and RAG to process PDFs and</text>
  <text x="345" y="245" font-family="Arial" font-size="12" fill="white">scanned documents. Try uploading!</text>
  <text x="545" y="255" text-anchor="end" font-family="Arial" font-size="10" fill="#E8EAF6">Bot • Just now</text>
  
  <!-- Input Area -->
  <rect x="220" y="275" width="300" height="35" rx="17" fill="#f5f5f5"/>
  <text x="235" y="297" font-family="Arial" font-size="12" fill="#999">Type your message...</text>
  <circle cx="580" cy="292" r="18" fill="#667eea"/>
  <text x="580" y="297" text-anchor="middle" font-family="Arial" font-size="16" fill="white">➤</text>
  
  <!-- Document Icons -->
  <rect x="80" y="150" width="100" height="80" rx="8" fill="white" opacity="0.8"/>
  <text x="130" y="185" text-anchor="middle" font-family="Arial" font-size="30">📄</text>
  <text x="130" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#333">PDF</text>
  
  <rect x="80" y="250" width="100" height="80" rx="8" fill="white" opacity="0.8"/>
  <text x="130" y="285" text-anchor="middle" font-family="Arial" font-size="30">🖼️</text>
  <text x="130" y="315" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Images</text>
  
  <rect x="620" y="150" width="100" height="80" rx="8" fill="white" opacity="0.8"/>
  <text x="670" y="185" text-anchor="middle" font-family="Arial" font-size="30">📝</text>
  <text x="670" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Text</text>
  
  <rect x="620" y="250" width="100" height="80" rx="8" fill="white" opacity="0.8"/>
  <text x="670" y="285" text-anchor="middle" font-family="Arial" font-size="30">🔍</text>
  <text x="670" y="315" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#333">RAG</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">Deep Chat: LLM Chatbot</text>
  <text x="400" y="75" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFD700">Customizable with API &amp; LLM Integration</text>
  
  <!-- Tech Stack -->
  <rect x="150" y="350" width="100" height="35" rx="5" fill="#FF9800"/>
  <text x="200" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="white">LangChain</text>
  
  <rect x="270" y="350" width="100" height="35" rx="5" fill="#FF5722"/>
  <text x="320" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Transformers</text>
  
  <rect x="390" y="350" width="100" height="35" rx="5" fill="#4B7500"/>
  <text x="440" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="white">LoRA</text>
  
  <rect x="510" y="350" width="100" height="35" rx="5" fill="#00BCD4"/>
  <text x="560" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="white">ChromaDB</text>
  
  <rect x="630" y="350" width="100" height="35" rx="5" fill="#795548"/>
  <text x="680" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Ollama</text>
</svg>
