<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Data Flow Visualization -->
  <circle cx="150" cy="200" r="60" fill="#4CAF50" opacity="0.8"/>
  <text x="150" y="205" text-anchor="middle" font-family="Arial" font-size="24" fill="white">Web</text>
  
  <circle cx="400" cy="200" r="60" fill="#2196F3" opacity="0.8"/>
  <text x="400" y="195" text-anchor="middle" font-family="Arial" font-size="24" fill="white">Data</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial" font-size="24" fill="white">Pipeline</text>
  
  <circle cx="650" cy="200" r="60" fill="#FF9800" opacity="0.8"/>
  <text x="650" y="195" text-anchor="middle" font-family="Arial" font-size="24" fill="white">Analytics</text>
  <text x="650" y="220" text-anchor="middle" font-family="Arial" font-size="24" fill="white">&amp; Insights</text>
  
  <!-- Arrows -->
  <path d="M 220 200 L 330 200" stroke="white" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 470 200 L 580 200" stroke="white" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="white">Data Engineer Intern</text>
  <text x="400" y="120" text-anchor="middle" font-family="Arial" font-size="24" fill="#FFD700">Opplane, California</text>
  
  <!-- Tech Icons -->
  <rect x="180" y="300" width="100" height="40" rx="5" fill="#3776AB"/>
  <text x="230" y="325" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Python</text>
  
  <rect x="310" y="300" width="100" height="40" rx="5" fill="#61DAFB"/>
  <text x="360" y="325" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Scrapy</text>
  
  <rect x="440" y="300" width="100" height="40" rx="5" fill="#00CED1"/>
  <text x="490" y="325" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Selenium</text>
  
  <rect x="570" y="300" width="100" height="40" rx="5" fill="#2496ED"/>
  <text x="620" y="325" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Docker</text>
</svg>
